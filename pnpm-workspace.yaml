allowBuilds:
  # postinstall is only an opencollective donation banner; the generator jar
  # is downloaded lazily on first run, so build scripts are not needed
  '@openapitools/openapi-generator-cli': false
  '@parcel/watcher': false
  esbuild: false
  lmdb: false
  msgpackr-extract: false
minimumReleaseAgeExclude:
  - postcss@8.5.19
  - picomatch@4.0.4
  # @openapitools/openapi-generator-cli tree (T207): registry reports fetch-time
  # as publish-time for these (several are years old), tripping the age gate
  - '@nestjs/axios@4.0.1'
  - '@nestjs/common@11.1.27'
  - '@nestjs/core@11.1.27'
  - '@openapitools/openapi-generator-cli@2.39.1'
