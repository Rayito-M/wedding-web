<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>OG cover card</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&family=DM+Sans:wght@400;500&family=DM+Serif+Display:ital@0;1&display=swap">
<style>
:root{--bg:#f8f6f2;--ink:#3a2a1f;--sub:#8a6b54;--accent:#c97155;--line:rgba(58,42,31,.12);
--font-serif:"DM Serif Display",serif;--font-book:"Cormorant Garamond",serif;--font-sans:"DM Sans",system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg)}
.board{width:1200px;height:630px;background:var(--bg);position:relative;overflow:hidden}
.names{font-family:var(--font-serif);font-weight:400;color:var(--ink);line-height:.95;letter-spacing:-.02em}
.names .amp{color:var(--accent)}
.quote{font-family:var(--font-book);font-style:italic;color:var(--ink)}
.meta{font-family:var(--font-sans);color:var(--sub);letter-spacing:.01em}
.rule{height:1px;background:var(--line);border:0}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="fishpair" viewBox="0 0 216 60"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><g><path d="M 18 30 L 4 18 L 10 30 L 4 42 Z"></path><path d="M 18 30 C 36 8, 86 8, 104 30 C 86 52, 36 52, 18 30 Z"></path><path d="M 50 16 Q 60 6, 72 16" stroke-linecap="round"></path><path d="M 56 46 Q 62 52, 68 46" stroke-linecap="round"></path><path d="M 86 22 Q 82 30, 86 38" stroke-width="1.12" stroke-linecap="round" opacity=".7"></path><circle cx="96" cy="28" r="1.6" fill="currentColor" stroke="none"></circle></g><g transform="translate(216 0) scale(-1 1)"><path d="M 18 30 L 4 18 L 10 30 L 4 42 Z"></path><path d="M 18 30 C 36 8, 86 8, 104 30 C 86 52, 36 52, 18 30 Z"></path><path d="M 50 16 Q 60 6, 72 16" stroke-linecap="round"></path><path d="M 56 46 Q 62 52, 68 46" stroke-linecap="round"></path><path d="M 86 22 Q 82 30, 86 38" stroke-width="1.12" stroke-linecap="round" opacity=".7"></path><circle cx="96" cy="28" r="1.6" fill="currentColor" stroke="none"></circle></g></g></symbol></defs></svg>
<div class="board">
<svg width="360" height="100" style="color:var(--accent);position:absolute;top:74px;left:812px"><use href="#fishpair"></use></svg>
<div style="position:absolute;left:300px;top:176px;width:615px;text-align:left">
<div class="quote" style="font-size:46px;line-height:1.15">« Como la trucha al trucho »</div>
<div class="names" style="font-size:92px;margin-top:26px">Sara <span class="amp">&amp;</span><br>Christophe</div>
<hr class="rule" style="width:120px;margin:30px 0 26px">
<div class="meta" style="font-size:29px">5 de junio de 2027 · Granada</div>
</div></div>
</body></html>
