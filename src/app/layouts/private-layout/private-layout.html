<app-screen-header
  [active]="chrome().id ?? ''"
  [showNav]="chrome().topNav ?? false"
  class="header"
  [class.scrolled]="isScrolled()"
/>

<!-- Hub ADR-0042 §1/§2, T341: the active route's registered head, projected
     from the screen's own injector into this layout's view. Pinned above the
     scroll region — see `.screen-head` in private-layout.scss. -->
@if (screenChrome.head(); as headTemplate) {
  <div class="screen-head">
    <ng-container [ngTemplateOutlet]="headTemplate" />
  </div>
}

<!-- `main` stays the single scroller (ADR-0041 §3) for a flow screen; it
     yields only when the active route pins something (`pinned()`), in which
     case `.screen-scroll` below becomes the one region that scrolls — see
     private-layout.scss for both halves of the contract. -->
<main
  #mainContent
  (scroll)="onMainScroll()"
  [class.pinned]="pinned()"
  [class.after-head]="!!chrome().headPinned"
>
  <div class="screen-scroll" [class.pinned]="pinned()">
    <router-outlet />
  </div>
</main>

@if (screenChrome.foot(); as footTemplate) {
  <div class="screen-foot">
    <ng-container [ngTemplateOutlet]="footTemplate" />
  </div>
}

@if (chrome().moto) {
  <app-decor-motorcycle-rider
    class="mobile-moto"
    mode="ground"
    color="var(--ink)"
    accentColor="var(--brand-accent)"
    [width]="54"
    [bottom]="0"
  />
}

@if (chrome().tabBar) {
  <app-tab-bar class="tab-bar" [active]="chrome().id ?? ''" />
}

@if (profileModal.isOpen()) {
  <app-profile-modal
    [open]="profileModal.isOpen()"
    [profile]="resolvedProfile() ?? null"
    [isOwnProfile]="isOwnProfile()"
    [delegateChips]="delegateChips()"
    [canHaveDelegates]="isGuest()"
    [saving]="savingProfile()"
    [saveError]="profileSaveError()"
    (save)="onProfileSave($event)"
    (close)="profileModal.close()"
  />
}

@for (stack of toastCenter.stacks(); track stack.placement) {
  <app-toast-stack [placement]="stack.placement" [clearsTabBar]="true">
    @for (t of stack.toasts; track t.id) {
      <app-toast
        [tone]="t.tone"
        [variant]="t.variant"
        [icon]="t.icon"
        [title]="t.title"
        [meta]="t.meta"
        [actionLabel]="t.actionLabel"
        [delay]="t.delay"
        [dismissible]="t.dismissible"
        (close)="toastCenter.dismiss(t.id)"
        >{{ t.body }}</app-toast
      >
    }
  </app-toast-stack>
}
