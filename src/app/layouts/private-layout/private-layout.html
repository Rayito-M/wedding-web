<app-screen-header
  [active]="chrome().id ?? ''"
  [showNav]="chrome().topNav ?? false"
  class="header"
  [class.scrolled]="isScrolled()"
/>

<!-- Prototype gate (hub ADR-0042 §2, T341): the active route's registered
     head, projected from the screen's own injector into this layout's view.
     Unstyled on purpose — this spike is about mechanism, not chrome. -->
@if (screenChrome.head(); as headTemplate) {
  <ng-container [ngTemplateOutlet]="headTemplate" />
}

<main #mainContent (scroll)="onMainScroll()">
  <router-outlet />
</main>

@if (chrome().moto) {
  <app-decor-motorcycle-rider
    class="mobile-moto"
    mode="ground"
    color="var(--ink)"
    accentColor="var(--brand-accent)"
    [width]="54"
    [bottom]="0"
  />
}

@if (chrome().tabBar) {
  <app-tab-bar class="tab-bar" [active]="chrome().id ?? ''" />
}

@if (profileModal.isOpen()) {
  <app-profile-modal
    [open]="profileModal.isOpen()"
    [profile]="resolvedProfile() ?? null"
    [isOwnProfile]="isOwnProfile()"
    [delegateChips]="delegateChips()"
    [canHaveDelegates]="isGuest()"
    [saving]="savingProfile()"
    [saveError]="profileSaveError()"
    (save)="onProfileSave($event)"
    (close)="profileModal.close()"
  />
}

@for (stack of toastCenter.stacks(); track stack.placement) {
  <app-toast-stack [placement]="stack.placement" [clearsTabBar]="true">
    @for (t of stack.toasts; track t.id) {
      <app-toast
        [tone]="t.tone"
        [variant]="t.variant"
        [icon]="t.icon"
        [title]="t.title"
        [meta]="t.meta"
        [actionLabel]="t.actionLabel"
        [delay]="t.delay"
        [dismissible]="t.dismissible"
        (close)="toastCenter.dismiss(t.id)"
        >{{ t.body }}</app-toast
      >
    }
  </app-toast-stack>
}
