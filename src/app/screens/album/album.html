<div class="title-block">
  <div>
    <h1>Our album</h1>
    <p class="sub">Shared by all of you.</p>
  </div>
  <button class="fab" type="button" aria-label="Add a photo" (click)="album.upload()">+</button>
</div>

<div class="content">
  <div class="filters">
    @for (c of categories; track c) {
      <button
        type="button"
        class="filter"
        [class.on]="album.filter() === c"
        (click)="album.filter.set(c)"
      >
        {{ c }}
      </button>
    }
  </div>

  <div class="grid">
    @for (p of album.filtered(); track p.label) {
      <app-photo-placeholder [label]="p.label" [style.height.px]="p.h" />
    }
  </div>

  <div class="hint">Tap <strong>+</strong> to add a photo from the day.</div>
</div>
