<div class="title-block">
  <div>
    <h1>{{ 'schedule.title' | translate }}</h1>
    <p class="sub">{{ 'schedule.subtitle' | translate }}</p>
  </div>
  <span class="date-badge">
    <span class="date-badge-full">SAT &middot; 5 JUN 2027</span>
    <span class="date-badge-short">SAT &middot; 5 JUN</span>
  </span>
</div>

<div class="timeline">
  @for (it of items(); track it.t; let last = $last) {
    <app-timeline-item
      [time]="it.t"
      [heading]="it.title"
      [tag]="it.tag"
      [sub]="it.sub"
      [last]="last"
    />
  }
</div>

<app-decor-motorcycle-rider
  class="mobile-moto"
  mode="ground"
  color="var(--ink)"
  accentColor="var(--brand-accent)"
  [width]="54"
  [bottom]="52"
/>
