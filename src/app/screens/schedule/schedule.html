<div class="title-block">
  <h1>{{ 'schedule.title' | translate }}</h1>
  <p class="sub">{{ 'schedule.subtitle' | translate }}</p>
</div>

<div class="timeline">
  @for (it of items(); track it.t; let last = $last) {
    <app-timeline-item
      [time]="it.t"
      [heading]="it.title"
      [tag]="it.tag"
      [sub]="it.sub"
      [last]="last"
    />
  }
</div>
