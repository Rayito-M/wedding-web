<header>
  <app-monogram [size]="18" />
  <span class="header-meta">SAT · 5 JUN</span>
</header>

<div class="title-block">
  <h1>The day</h1>
  <p class="sub">From afternoon into the small hours.</p>
</div>

<div class="timeline">
  @for (it of items; track it.t; let last = $last) {
    <div class="item">
      <div class="time">{{ it.t }}</div>
      <div class="rail">
        <span class="dot"></span>
        @if (!last) {
          <span class="line"></span>
        }
      </div>
      <div class="body">
        <div class="row">
          <div class="item-title">{{ it.title }}</div>
          <span class="tag">{{ it.tag }}</span>
        </div>
        <div class="item-sub">{{ it.sub }}</div>
      </div>
    </div>
  }
</div>
