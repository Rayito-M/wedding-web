<app-decor-sun class="sun" [size]="desktop() ? 130 : 90" />

<header>
  <app-pill>{{ 'welcome.saveDate' | translate }}</app-pill>
  <div class="selectors">
    <app-language-selector></app-language-selector>
  </div>
</header>

<div class="center">
  <h1 class="names">
    <span class="name">{{ brideName }}</span>
    <span class="fish">
      <app-decor-fish-pair [size]="desktop() ? 420 : 200" />
    </span>
    <span class="quote">{{ tagline }}</span>
    <span class="name">{{ groomName }}</span>
  </h1>

  <div class="date">
    <span class="rule"></span>
    <div class="date-content">
      <span class="value first-letter">{{ date | date: 'fullDate' : '' : language }}</span>
      <span class="location">{{ city | translate }} - {{ country | translate }}</span>
    </div>
    <span class="rule"></span>
  </div>
</div>

<div class="bottom">
  <div class="alhambra">
    <app-decor-alhambra [w]="desktop() ? 900 : 360" />
  </div>

    <button app-btn [full]="!desktop()" (click)="open()">{{ 'welcome.cta' | translate }}</button>
    <div class="caption">{{ 'welcome.venue' | t }}</div>
  </div> -->
  <div></div>
</div>
