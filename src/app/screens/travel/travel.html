<div class="title-block">
  <div class="title-copy">
    <h1>Getting there</h1>
    <p class="sub">Fly to Granada (GRX) · 20 min to venue.</p>
  </div>
  <span class="eyebrow-badge">ALBAICÍN · GRANADA</span>
</div>

<div class="layout">
  <!-- Stylized map — Granada: Alhambra hill, Darro river, Albaicín.
       Production: replace with a real map (Leaflet/Mapbox) styled to theme,
       or keep the illustration. -->
  <div class="map">
    <svg width="100%" height="100%" viewBox="0 0 360 140" preserveAspectRatio="none" aria-hidden="true">
      <!-- Sierra Nevada peaks far back -->
      <path
        class="sierra-peaks"
        d="M0 40 L40 16 L80 32 L130 12 L180 28 L230 14 L280 30 L320 20 L360 32 L360 70 L0 70 Z"
        opacity="0.35"
      />
      <!-- Alhambra hill silhouette (right) -->
      <path
        class="alhambra-hill"
        d="M180 70 Q230 50, 260 60 Q300 50, 360 65 L360 100 L180 100 Z"
        opacity="0.55"
      />
      <!-- Albaicín hill (left) -->
      <path
        class="albaicin-hill"
        d="M0 80 Q40 60, 90 70 Q130 60, 180 75 L180 100 L0 100 Z"
        opacity="0.5"
      />
      <!-- Darro river — wavy line between the two hills -->
      <path
        class="darro-river"
        d="M0 96 Q 60 100, 120 96 T 240 100 T 360 96"
        stroke-width="1.2"
        fill="none"
        opacity="0.7"
      />
      <!-- roads -->
      <path
        class="roads"
        d="M40 110 Q 120 105, 200 100 T 340 95"
        stroke-width="1"
        fill="none"
        stroke-dasharray="3 4"
      />
      <!-- pin — Palacio de los Córdova, at foot of the Alhambra -->
      <circle class="pin-dot" cx="220" cy="82" r="6" />
      <circle class="pin-glow" cx="220" cy="82" r="12" opacity="0.25" />
    </svg>
    <div class="map-label">Palacio de los Córdova</div>
    <div class="river-label">río Darro</div>
  </div>

  <div class="stays">
    <div class="label section-label">Stays nearby</div>
    @for (s of stays; track s.name; let last = $last) {
      <app-stay-card
        [class.last]="last"
        [name]="s.name"
        [meta]="s.km"
        [tag]="s.tag"
        [price]="s.price"
        [thumbLabel]="s.tag.slice(0, 4)"
      />
    }
  </div>
</div>
