<svg [attr.width]="size()" [attr.height]="size()" viewBox="0 0 80 80" aria-hidden="true">
  <circle cx="40" cy="40" r="16" [style.fill]="color()" />
  @for (r of rays; track $index) {
    <line
      [attr.x1]="r.x1"
      [attr.y1]="r.y1"
      [attr.x2]="r.x2"
      [attr.y2]="r.y2"
      [style.stroke]="color()"
      stroke-width="1.6"
      stroke-linecap="round"
    />
  }
</svg>
