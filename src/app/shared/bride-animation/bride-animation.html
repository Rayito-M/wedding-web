<svg
  [attr.width]="width()"
  [attr.height]="height()"
  viewBox="0 0 147 90"
  aria-hidden="true"
  preserveAspectRatio="xMidYMid meet"
>
  <defs>
    <clipPath [attr.id]="clipId()">
      <rect x="0" y="0" width="130" height="90" />
    </clipPath>
  </defs>

  @if (run()) {
    <g [attr.clip-path]="'url(#' + clipId() + ')'">
      <g
        [style.animation]="'btaSeq ' + run()!.durationSeconds + 's ease-in-out both'"
        (animationend)="onAnimationEnd()"
      >
        <!-- Bride body with bobbing motion -->
        <g style="animation: btaBob 0.55s ease-in-out infinite alternate">
          <!-- head + flower -->
          <circle
            cx="67"
            cy="40.6"
            r="4.9"
            fill="none"
            [attr.stroke]="color()"
            stroke-width="1.4"
            stroke-linejoin="round"
            stroke-linecap="round"
          />
          <circle cx="67" cy="33.7" r="1.3" [attr.fill]="accentColor()" stroke="none" />

          <!-- veil -->
          <path
            [attr.d]="'M 63 37.1 Q 58.3 44.8 59.5 55.3 Q 59 63 60.2 67.2'"
            fill="none"
            [attr.stroke]="accentColor()"
            stroke-width="1.1"
            stroke-linejoin="round"
            stroke-linecap="round"
          />

          <!-- neck + bodice -->
          <path
            d="M 67 45.5 L 67 56"
            fill="none"
            [attr.stroke]="color()"
            stroke-width="1.4"
            stroke-linejoin="round"
            stroke-linecap="round"
          />
          <path
            d="M 63 56 L 67 63.7 L 71 56"
            fill="none"
            [attr.stroke]="color()"
            stroke-width="1.4"
            stroke-linejoin="round"
            stroke-linecap="round"
          />

          <!-- dress -->
          <path
            d="M 64.2 61.6 L 57.4 84.7 Q 67 88.8 76.6 84.7 L 69.8 61.6"
            fill="none"
            [attr.stroke]="color()"
            stroke-width="1.4"
            stroke-linejoin="round"
            stroke-linecap="round"
          />
          <line
            x1="63"
            y1="65"
            x2="71"
            y2="65"
            fill="none"
            [attr.stroke]="color()"
            stroke-width="0.8"
            stroke-linejoin="round"
            stroke-linecap="round"
          />

          <!-- static arm (viewer left) -->
          <path
            d="M 63 56 Q 58 61.6 60.2 66.5"
            fill="none"
            [attr.stroke]="color()"
            stroke-width="1.4"
            stroke-linejoin="round"
            stroke-linecap="round"
          />

          <!-- waving arm — pivots at the shoulder -->
          <g [style.animation]="'btaWave ' + run()!.durationSeconds + 's ease-in-out both'" style="transform-origin: 70px 56.7px">
            <path
              d="M 70 56.7 Q 75 51.1 76.6 44.1"
              fill="none"
              [attr.stroke]="color()"
              stroke-width="1.4"
              stroke-linejoin="round"
              stroke-linecap="round"
            />
            <circle
              cx="76.1"
              cy="42.7"
              r="1.5"
              fill="none"
              [attr.stroke]="color()"
              stroke-width="0.8"
              stroke-linejoin="round"
              stroke-linecap="round"
            />
          </g>
        </g>

        <!-- speech bubble -->
        <g [style.animation]="'btaBubble ' + run()!.durationSeconds + 's ease-in-out both'" style="transform-origin: 85px 36px">
          <rect
            x="76"
            y="20"
            width="41"
            height="14.7"
            rx="7"
            fill="var(--bg, #fff)"
            [attr.stroke]="color()"
            stroke-width="1.1"
          />
          <path
            d="M 83 33.4 L 79.3 40 L 89 33.4"
            fill="var(--bg, #fff)"
            [attr.stroke]="color()"
            stroke-width="1.1"
            stroke-linejoin="round"
          />
          <text
            x="96.5"
            y="29.8"
            text-anchor="middle"
            font-size="7.7"
            font-family="var(--font-sans, sans-serif)"
            [attr.fill]="color()"
          >
            {{ greeting() }}
          </text>
        </g>
      </g>
    </g>
  }
</svg>
