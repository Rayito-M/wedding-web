@if (open()) {
  <div class="modal-backdrop" [class.lg]="size() !== 'sm'" (click)="onBackdrop()">
    <div
      class="modal-card"
      [class.lg]="size() !== 'sm'"
      [class.xl]="size() === 'xl'"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="title() ? titleId : null"
      (click)="$event.stopPropagation()"
    >
      @if (size() !== 'sm') {
        <div class="modal-drag-handle" aria-hidden="true"></div>
      }

      <div class="modal-header">
        <div class="modal-heading">
          <ng-content select="[modal-eyebrow]" />
          @if (title()) {
            <h2 class="modal-title" [id]="titleId">{{ title() }}</h2>
          }
        </div>

        @if (dismissable() && showClose()) {
          <button type="button" class="modal-close" aria-label="Close" (click)="close.emit()">
            ×
          </button>
        }
      </div>

      <div class="modal-body">
        <ng-content />
      </div>

      <div class="modal-actions">
        <ng-content select="[modal-actions]" />
      </div>
    </div>
  </div>
}
