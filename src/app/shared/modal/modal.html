@if (open()) {
  <div class="modal-backdrop" [class.lg]="size() === 'lg'" (click)="onBackdrop()">
    <div
      class="modal-card"
      [class.lg]="size() === 'lg'"
      role="dialog"
      aria-modal="true"
      (click)="$event.stopPropagation()"
    >
      @if (size() === 'lg') {
        <div class="modal-drag-handle" aria-hidden="true"></div>
      }

      <div class="modal-header">
        @if (title()) {
          <h2 class="modal-title">{{ title() }}</h2>
        }

        @if (dismissable()) {
          <button type="button" class="modal-close" aria-label="Close" (click)="close.emit()">
            ×
          </button>
        }
      </div>

      <div class="modal-body">
        <ng-content />
      </div>

      <div class="modal-actions">
        <ng-content select="[modal-actions]" />
      </div>
    </div>
  </div>
}
