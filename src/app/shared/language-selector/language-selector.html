<div class="language-selector">
  @if (languages()) {
    <button
      type="button"
      class="dropdown-toggle"
      (click)="toggleDropdown()"
      [attr.aria-expanded]="isOpen()"
    >
      {{ currentLanguage().toUpperCase() }}
      <span class="icon">▼</span>
    </button>
    @if (isOpen() && Object.keys(languages() || {}).length >= 2) {
      <div class="dropdown-menu">
        @for (entry of languages() | keyvalue; track entry.key) {
          <button
            type="button"
            class="dropdown-item"
            [class.active]="currentLanguage() === entry.key"
            (click)="selectLanguage(entry.key); $event.stopPropagation()"
          >
            <span>{{ entry.value }}</span>
            <span class="lang-code">{{ entry.key.toUpperCase() }} </span>
          </button>
        }
      </div>
    }
  }
</div>
